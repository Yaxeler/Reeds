name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Новый пуш в ту же ветку отменяет ещё идущую проверку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Commitlint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            pnpm exec commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
          fi

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Prettier
            run: pnpm run check:formatting
          - name: Stylelint
            run: pnpm run check:styles
          - name: Oxlint
            run: pnpm run check:oxlint
          - name: ESLint
            run: pnpm run check:eslint
          - name: Types
            run: pnpm run check:types
          - name: Vitest
            run: pnpm run test
          - name: Build
            run: pnpm run generate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
